[project]
name = "tessera-nordic"
version = "0.1.0"
description = "Cluster TESSERA satellite embeddings over Norway and Sweden on a 1 km grid."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SINTEF" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: the geotessera API changes between releases (docs/decisions.md).
    "geotessera==0.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
tessera-nordic = "tessera_nordic.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_nordic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "T20", "RUF"]
ignore = ["N803", "N806"]  # allow X / X_pca style names for matrices

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: needs network access (deselected by default in CI)"]
